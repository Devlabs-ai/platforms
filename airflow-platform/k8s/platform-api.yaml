apiVersion: apps/v1
kind: Deployment
metadata:
  name: airflow-platform-api
  namespace: airflow
  labels:
    app.kubernetes.io/name: airflow-platform-api
    app.kubernetes.io/part-of: airflow-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: airflow-platform-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: airflow-platform-api
    spec:
      containers:
        - name: api
          image: airflow-platform-api:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: AIRFLOW_NAMESPACE
              value: airflow
            - name: AIRFLOW_API_URL
              value: http://airflow-webserver.airflow.svc.cluster.local:8080/api/v1
            - name: AIRFLOW_UI_URL
              value: http://192.168.1.3:30081
            - name: AIRFLOW_USER
              value: admin
            - name: AIRFLOW_PASSWORD
              value: admin
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: airflow-platform-api
  namespace: airflow
  labels:
    app.kubernetes.io/name: airflow-platform-api
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: airflow-platform-api
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30089
