apiVersion: v1
kind: ServiceAccount
metadata:
  name: devlabs-dashboard
  namespace: devlabs
  labels:
    app.kubernetes.io/name: devlabs-dashboard
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: devlabs-dashboard
  labels:
    app.kubernetes.io/name: devlabs-dashboard
rules:
  - apiGroups: [""]
    resources: ["nodes", "pods", "namespaces", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes", "pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: devlabs-dashboard
  labels:
    app.kubernetes.io/name: devlabs-dashboard
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: devlabs-dashboard
subjects:
  - kind: ServiceAccount
    name: devlabs-dashboard
    namespace: devlabs
