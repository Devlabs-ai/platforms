<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Spark Platform</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a2332;
      --border: #2d3a4f;
      --text: #e7ecf3;
      --muted: #8b9cb3;
      --accent: #f59e0b;
      --ok: #22c55e;
      --fail: #ef4444;
      --run: #3b82f6;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    header {
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }
    h1 { margin: 0; font-size: 1.25rem; font-weight: 600; }
    .sub { color: var(--muted); font-size: 0.875rem; }
    main { max-width: 1200px; margin: 0 auto; padding: 1.5rem; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
    @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1rem 1.25rem;
    }
    .card h2 { margin: 0 0 1rem; font-size: 1rem; }
    label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 0.25rem; }
    input, select {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      padding: 0.5rem 0.65rem;
      margin-bottom: 0.75rem;
      font-size: 0.9rem;
    }
    button {
      background: var(--accent);
      color: #111;
      border: none;
      border-radius: 6px;
      padding: 0.55rem 1rem;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.9rem;
    }
    button.secondary {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
    th, td { text-align: left; padding: 0.6rem 0.5rem; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-weight: 500; }
    .badge {
      display: inline-block;
      padding: 0.15rem 0.5rem;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .badge.SUCCEEDED, .badge.COMPLETED { background: #14532d; color: var(--ok); }
    .badge.FAILED { background: #450a0a; color: var(--fail); }
    .badge.RUNNING, .badge.SUBMITTED { background: #1e3a5f; color: #93c5fd; }
    .badge.PENDING, .badge.UNKNOWN { background: #374151; color: var(--muted); }
    .actions { display: flex; gap: 0.35rem; flex-wrap: wrap; }
    .actions button { padding: 0.25rem 0.5rem; font-size: 0.75rem; }
    #logs {
      background: #000;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.75rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.75rem;
      white-space: pre-wrap;
      max-height: 360px;
      overflow: auto;
      color: #d1d5db;
    }
    .toolbar { display: flex; gap: 0.5rem; align-items: center; margin-bottom: 0.75rem; }
    .msg { font-size: 0.85rem; color: var(--muted); margin-top: 0.5rem; }
    a { color: #93c5fd; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Spark Platform</h1>
      <div class="sub">Submit jobs · track status · view driver logs</div>
    </div>
    <div class="toolbar">
      <a id="historyLink" href="#" target="_blank" rel="noopener">History Server</a>
      <button class="secondary" id="refreshBtn" type="button">Refresh</button>
    </div>
  </header>

  <main>
    <div class="grid">
      <section class="card">
        <h2>Submit job</h2>
        <form id="submitForm">
          <label for="name">Job name</label>
          <input id="name" name="name" placeholder="pi-demo" required pattern="[a-z0-9]([-a-z0-9]*[a-z0-9])?" />

          <label for="user">User</label>
          <input id="user" name="user" placeholder="alice" value="devlabs" />

          <label for="main_class">Main class</label>
          <input id="main_class" name="main_class" value="org.apache.spark.examples.SparkPi" required />

          <label for="jar">Application JAR (in image)</label>
          <input id="jar" name="jar" value="local:///opt/spark/examples/jars/spark-examples.jar" />

          <label for="arguments">Arguments (comma-separated)</label>
          <input id="arguments" name="arguments" value="10" />

          <label for="executors">Executor instances</label>
          <input id="executors" name="executors" type="number" min="1" max="4" value="1" />

          <button type="submit" id="submitBtn">Submit</button>
          <div class="msg" id="submitMsg"></div>
        </form>
      </section>

      <section class="card">
        <h2>Driver logs</h2>
        <div id="logs">Select a job and click Logs.</div>
      </section>
    </div>

    <section class="card" style="margin-top: 1.5rem;">
      <h2>Jobs</h2>
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>User</th>
            <th>Status</th>
            <th>Started</th>
            <th>Finished</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="jobsBody">
          <tr><td colspan="6" class="sub">Loading…</td></tr>
        </tbody>
      </table>
    </section>
  </main>

  <script>
    const jobsBody = document.getElementById('jobsBody');
    const logsEl = document.getElementById('logs');
    const submitMsg = document.getElementById('submitMsg');
    const historyLink = document.getElementById('historyLink');

    async function api(path, opts = {}) {
      const res = await fetch(path, {
        headers: { 'Content-Type': 'application/json', ...opts.headers },
        ...opts,
      });
      if (!res.ok) {
        const text = await res.text();
        throw new Error(text || res.statusText);
      }
      if (res.status === 204) return null;
      const ct = res.headers.get('content-type') || '';
      if (ct.includes('application/json')) return res.json();
      return res.text();
    }

    function fmtTime(t) {
      if (!t) return '—';
      return new Date(t).toLocaleString();
    }

    async function loadJobs() {
      const data = await api('/api/jobs');
      if (!data.jobs.length) {
        jobsBody.innerHTML = '<tr><td colspan="6" class="sub">No jobs yet.</td></tr>';
        return;
      }
      jobsBody.innerHTML = data.jobs.map(job => `
        <tr>
          <td><code>${job.name}</code></td>
          <td>${job.user}</td>
          <td><span class="badge ${job.status}">${job.status}</span></td>
          <td>${fmtTime(job.start)}</td>
          <td>${fmtTime(job.finish)}</td>
          <td class="actions">
            <button type="button" data-logs="${job.name}">Logs</button>
            <button type="button" class="secondary" data-detail="${job.name}">Detail</button>
          </td>
        </tr>
      `).join('');

      jobsBody.querySelectorAll('[data-logs]').forEach(btn => {
        btn.addEventListener('click', () => showLogs(btn.dataset.logs));
      });
      jobsBody.querySelectorAll('[data-detail]').forEach(btn => {
        btn.addEventListener('click', () => showDetail(btn.dataset.detail));
      });
    }

    async function showLogs(name) {
      logsEl.textContent = 'Loading logs…';
      try {
        const text = await api(`/api/jobs/${name}/logs`);
        logsEl.textContent = text;
      } catch (e) {
        logsEl.textContent = String(e.message || e);
      }
    }

    async function showDetail(name) {
      try {
        const job = await api(`/api/jobs/${name}`);
        logsEl.textContent = JSON.stringify(job, null, 2);
      } catch (e) {
        logsEl.textContent = String(e.message || e);
      }
    }

    document.getElementById('submitForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      submitMsg.textContent = '';
      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      try {
        const args = document.getElementById('arguments').value
          .split(',').map(s => s.trim()).filter(Boolean);
        const body = {
          name: document.getElementById('name').value.trim().toLowerCase(),
          user: document.getElementById('user').value.trim() || 'anonymous',
          main_class: document.getElementById('main_class').value.trim(),
          jar: document.getElementById('jar').value.trim(),
          arguments: args,
          executor_instances: Number(document.getElementById('executors').value) || 1,
        };
        await api('/api/jobs', { method: 'POST', body: JSON.stringify(body) });
        submitMsg.textContent = `Submitted ${body.name}`;
        await loadJobs();
      } catch (err) {
        submitMsg.textContent = err.message || String(err);
      } finally {
        btn.disabled = false;
      }
    });

    document.getElementById('refreshBtn').addEventListener('click', loadJobs);

  (async function init() {
    try {
      const cfg = await api('/api/config');
      historyLink.href = cfg.historyUiUrl;
      historyLink.textContent = 'History Server';
    } catch (_) {}
    await loadJobs();
    setInterval(loadJobs, 8000);
  })();
  </script>
</body>
</html>
