apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: JOB_NAME_PLACEHOLDER
  namespace: spark
  labels:
    app.kubernetes.io/part-of: customer-aggregation-skew
    challenge.devlabs/variant: "JOB_VARIANT_PLACEHOLDER"
spec:
  type: Python
  pythonVersion: "3"
  mode: cluster
  image: apache/spark:3.5.3
  imagePullPolicy: IfNotPresent
  sparkVersion: "3.5.3"
  mainApplicationFile: JOB_SCRIPT_S3A_PLACEHOLDER
  sparkConf:
    spark.eventLog.enabled: "true"
    spark.eventLog.dir: "file:/mnt/spark-events"
    # Operator runs spark-submit with HOME=/nonexistent; Ivy must use a writable path.
    spark.jars.ivy: /tmp/.ivy2
    spark.sql.shuffle.partitions: "4"
    spark.sql.adaptive.enabled: "false"
    spark.sql.adaptive.skewJoin.enabled: "false"
    spark.hadoop.fs.s3a.endpoint: "http://minio.minio.svc.cluster.local:9000"
    spark.hadoop.fs.s3a.access.key: "MINIO_ACCESS_KEY_PLACEHOLDER"
    spark.hadoop.fs.s3a.secret.key: "MINIO_SECRET_KEY_PLACEHOLDER"
    spark.hadoop.fs.s3a.path.style.access: "true"
    spark.hadoop.fs.s3a.impl: org.apache.hadoop.fs.s3a.S3AFileSystem
    spark.hadoop.fs.s3a.connection.ssl.enabled: "false"
    spark.jars.packages: "org.apache.hadoop:hadoop-aws:3.3.4,com.amazonaws:aws-java-sdk-bundle:1.12.262,org.postgresql:postgresql:42.7.3"
  hadoopConf:
    fs.s3a.endpoint: "http://minio.minio.svc.cluster.local:9000"
    fs.s3a.access.key: "MINIO_ACCESS_KEY_PLACEHOLDER"
    fs.s3a.secret.key: "MINIO_SECRET_KEY_PLACEHOLDER"
    fs.s3a.path.style.access: "true"
  driver:
    cores: 1
    memory: 1536m
    serviceAccount: spark
    env:
      - name: DATA_HOURS
        value: "DATA_HOURS_PLACEHOLDER"
      - name: INPUT_PATH
        value: "s3a://devlabs-data/challenges/customer-aggregation/transactions"
      - name: POSTGRES_JDBC_URL
        value: "jdbc:postgresql://postgres.postgres.svc.cluster.local:5432/devlabs"
      - name: POSTGRES_USER
        value: "devlabs"
      - name: POSTGRES_PASSWORD
        value: "POSTGRES_PASSWORD_PLACEHOLDER"
      - name: POSTGRES_TABLE
        value: "customer_aggregates"
    volumeMounts:
      - name: spark-events
        mountPath: /mnt/spark-events
  executor:
    cores: 1
    instances: 2
    memory: 1536m
    serviceAccount: spark
    volumeMounts:
      - name: spark-events
        mountPath: /mnt/spark-events
  volumes:
    - name: spark-events
      persistentVolumeClaim:
        claimName: spark-events
  restartPolicy:
    type: Never
