apiVersion: batch/v1
kind: Job
metadata:
  name: JOB_NAME_PLACEHOLDER
  namespace: NAMESPACE_PLACEHOLDER
  labels:
    app.kubernetes.io/name: devlabs-data-tools
    app.kubernetes.io/part-of: devlabs-platform
    devlabs.dev/task: generate-l3-broadcast-catalog-enrichment
    challenge.devlabs/id: l3-broadcast-catalog-enrichment
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: devlabs-data-tools
        devlabs.dev/task: generate-l3-broadcast-catalog-enrichment
        challenge.devlabs/id: l3-broadcast-catalog-enrichment
    spec:
      restartPolicy: Never
      serviceAccountName: devlabs-data-tools
      containers:
        - name: generate
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: Always
          command:
            - python
            - /app/challenges/l3-broadcast-catalog-enrichment/generate.py
          env:
            - name: DATA_SEED
              value: "DATA_SEED_PLACEHOLDER"
            - name: MINIO_ENDPOINT
              value: "http://minio.minio.svc.cluster.local:9000"
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: devlabs-data-minio
                  key: access-key
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: devlabs-data-minio
                  key: secret-key
            - name: MINIO_BUCKET
              value: "MINIO_BUCKET_PLACEHOLDER"
            - name: DATA_S3_PREFIX
              value: "DATA_S3_PREFIX_PLACEHOLDER"
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 6Gi
