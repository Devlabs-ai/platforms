apiVersion: apps/v1
kind: Deployment
metadata:
  name: devlabs-dashboard
  namespace: devlabs
  labels:
    app.kubernetes.io/name: devlabs-dashboard
    app.kubernetes.io/part-of: devlabs-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: devlabs-dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: devlabs-dashboard
    spec:
      serviceAccountName: devlabs-dashboard
      containers:
        - name: dashboard
          image: devlabs-dashboard:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: MAC_MINI_IP
              value: "192.168.1.3"
            - name: COLIMA_CPU
              value: "6"
            - name: COLIMA_MEMORY_GIB
              value: "12"
            - name: HOST_MEMORY_GIB
              value: "16"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: devlabs-dashboard
  namespace: devlabs
  labels:
    app.kubernetes.io/name: devlabs-dashboard
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: devlabs-dashboard
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30090
