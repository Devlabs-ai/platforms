apiVersion: batch/v1
kind: Job
metadata:
  name: JOB_NAME_PLACEHOLDER
  namespace: devlabs
  labels:
    app.kubernetes.io/name: devlabs-data-tools
    app.kubernetes.io/part-of: devlabs-platform
    devlabs.dev/task: generate-daily-product-sales-data
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: devlabs-data-tools
        devlabs.dev/task: generate-daily-product-sales-data
    spec:
      restartPolicy: Never
      serviceAccountName: devlabs-data-tools
      containers:
        - name: generate
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: Always
          command:
            - python
            - /app/scripts/generate_daily_product_sales_data.py
          env:
            - name: NUM_STORES
              value: "NUM_STORES_PLACEHOLDER"
            - name: ROWS_PER_STORE
              value: "ROWS_PER_STORE_PLACEHOLDER"
            - name: MALFORMED_RATE
              value: "MALFORMED_RATE_PLACEHOLDER"
            - name: BUSINESS_DATE
              value: "BUSINESS_DATE_PLACEHOLDER"
            - name: MINIO_ENDPOINT
              value: "http://minio.minio.svc.cluster.local:9000"
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: devlabs-data-minio
                  key: access-key
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: devlabs-data-minio
                  key: secret-key
            - name: MINIO_BUCKET
              value: "devlabs-data"
            - name: DATA_S3_PREFIX
              value: "challenges/daily-product-sales-pipeline-l1/input"
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
