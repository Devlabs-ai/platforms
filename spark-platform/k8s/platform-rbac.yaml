apiVersion: v1
kind: ServiceAccount
metadata:
  name: spark-platform-api
  namespace: spark
  labels:
    app.kubernetes.io/name: spark-platform-api
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: spark-platform-api
  namespace: spark
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["sparkoperator.k8s.io"]
    resources: ["sparkapplications"]
    verbs: ["get", "list", "watch", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: spark-platform-api
  namespace: spark
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: spark-platform-api
subjects:
  - kind: ServiceAccount
    name: spark-platform-api
    namespace: spark
