apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-platform-api
  namespace: spark
  labels:
    app.kubernetes.io/name: spark-platform-api
    app.kubernetes.io/part-of: spark-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: spark-platform-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: spark-platform-api
    spec:
      serviceAccountName: spark-platform-api
      containers:
        - name: api
          image: spark-platform-api:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SPARK_NAMESPACE
              value: spark
            - name: SPARK_EVENT_LOG_DIR
              value: file:/mnt/spark-events
            - name: SPARK_HISTORY_UI_URL
              value: http://192.168.1.3:30080
            - name: SPARK_IMAGE
              value: apache/spark:3.5.3
            - name: SPARK_VERSION
              value: "3.5.3"
            - name: SPARK_DRIVER_SA
              value: spark
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: spark-platform-api
  namespace: spark
  labels:
    app.kubernetes.io/name: spark-platform-api
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: spark-platform-api
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30088
